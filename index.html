<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Happy sugar DEMO">
<title>Happy sugar｜業務システム DEMO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#20314b}
body{background:radial-gradient(circle at 10% 8%,rgba(197,123,150,.12),transparent 24%),radial-gradient(circle at 95% 62%,rgba(207,164,64,.09),transparent 25%),linear-gradient(180deg,#fff 0%,#fff9fc 100%)}
main{min-height:100vh;display:flex;justify-content:center;padding:44px 22px 34px}
.portal{width:min(440px,100%);text-align:center}
.brand{width:130px;height:130px;border-radius:34px;margin:8px auto 18px;display:grid;place-items:center;background:#233a58;color:white;box-shadow:0 12px 32px rgba(35,58,88,.14);font-size:55px;font-weight:700}
.brand span{color:#e9bfd0}
.goldline{width:62px;height:2px;background:#c69a2d;margin:4px auto 26px}
h1{font-size:32px;line-height:1.25;margin:0 0 14px;font-weight:800;letter-spacing:.02em}
.sub{font-size:16px;line-height:1.7;color:#6e7380;margin:0 0 34px}
.menu{width:100%;border:1px solid #eee8ed;background:rgba(255,255,255,.97);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;text-align:left;box-shadow:0 10px 26px rgba(35,58,88,.08);cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit;font:inherit}
.menu:active{transform:scale(.99)}
.menu:focus-visible{outline:3px solid #c57b96;outline-offset:3px}
.menuIcon{width:64px;height:64px;border-radius:17px;background:#fae9f0;display:grid;place-items:center;font-size:31px;flex:none}
.menuText{flex:1;min-width:0}
.menuTitle{display:block;font-size:20px;font-weight:800}
.menuSub{display:block;font-size:14px;color:#6e7380;margin-top:5px;line-height:1.5}
.arrow{font-size:34px;color:#bc7892;line-height:1}
.note{margin-top:35px;padding:16px 18px;border-radius:15px;background:rgba(255,255,255,.75);color:#747986;font-size:13px;line-height:1.7}
.demoTag{display:inline-block;margin-bottom:18px;border-radius:100px;background:#f9e7ee;color:#874961;padding:6px 16px;font-size:12px;font-weight:800;letter-spacing:.08em}
</style>
<script>
// 営業用トップページ：本番のGAS・DB・スプレッドシートには接続しません。
function showComingSoon(){alert('こちらは営業用デモです。詳細画面は準備中です。');}
</script>
</head>
<body>
<main>
 <div class="portal">
   <div class="brand" aria-label="Happy sugar">H<span>S</span></div>
   <div class="goldline"></div>
   <div class="demoTag">営業用デモ</div>
   <h1>業務システム</h1>
   <p class="sub">Happy sugar の業務管理デモを<br>ご紹介します。</p>
   <button class="menu" type="button" onclick="location.href='./vehicle-demo.html'">
     <span class="menuIcon">🚗</span><span class="menuText"><span class="menuTitle">車両・ドライバー管理</span><span class="menuSub">車両情報・貸出状況・ドライバー管理</span></span><span class="arrow">›</span>
   </button>
   <button class="menu" type="button" onclick="location.href='./line-demo.html'" style="margin-top:16px">
     <span class="menuIcon">📩</span><span class="menuText"><span class="menuTitle">LINE受付管理</span><span class="menuSub">申込受付・お問い合わせ管理</span></span><span class="arrow">›</span>
   </button>
   <button class="menu" type="button" onclick="location.href='./shift-demo.html'" style="margin-top:16px">
     <span class="menuIcon">📅</span><span class="menuText"><span class="menuTitle">勤怠・シフト管理</span><span class="menuSub">シフト確認・出退勤・打刻管理</span></span><span class="arrow">›</span>
   </button>
   <div class="note">営業用のサンプル画面です。実際のお客様の情報やシステムには接続していません。</div>
 </div>
</main>
</body>
</html>
