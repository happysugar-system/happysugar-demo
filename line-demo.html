<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffafc"><title>Happy sugar｜LINE受付管理デモ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#20314b;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#233a58;color:#fff;padding:19px 16px}header small{color:#e9bfd0}header h1{margin:4px 0;font-size:23px}main{max-width:650px;margin:auto;padding:16px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:700}button:focus-visible{outline:3px solid #c57b96;outline-offset:2px}.primary{background:#233a58;color:#fff}.secondary{background:#f6e9ef;color:#693e55}.card,.record{background:#fff;border:1px solid #f0e6ec;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 4px 13px #233a580a}.record{width:100%;text-align:left}.record b{font-size:17px}.record p{margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#707888;font-size:13px}.pill{display:inline-block;background:#f7e6ee;color:#874961;border-radius:30px;padding:4px 10px;font-size:12px;font-weight:700}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.counts div{text-align:center;background:#fff;border:1px solid #f0e6ec;border-radius:12px;padding:12px 4px}.counts strong{display:block;font-size:27px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:9px;background:#fff}.field textarea{min-height:85px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cell{background:#f5f7fa;border-radius:10px;padding:12px;overflow-wrap:anywhere}.cell small{display:block;color:#707888;margin-bottom:4px}.cell strong{font-size:15px}.cell.wide{grid-column:1/-1}.key{background:#eef3fb}.back{background:none;padding:5px 0;color:#6c4860}.note{font-size:12px;color:#737987;line-height:1.8;margin:18px 0}#detail{display:none}.demo{background:#f8e6ee;color:#7d415c;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800}a{color:#874961}@media(max-width:370px){.detail-grid{grid-template-columns:1fr}.cell.wide{grid-column:auto}}
</style></head><body>
<header><small>Happy sugar / 営業用サンプル</small><h1>📩 LINE受付管理 <span class="demo">DEMO</span></h1><small>受付から対応状況の管理まで体験できます</small></header>
<main><section id="home"><div class="counts" id="counts"></div><div class="top"><h3>受付一覧</h3><button class="secondary" id="reset">↻ デモを初期化</button></div><div id="list"></div></section>
<section id="detail"><button class="back" id="back">← 受付一覧に戻る</button><div class="card"><div class="top"><h2 id="name" style="font-size:21px;margin:0"></h2><span class="pill" id="badge"></span></div><p class="muted" id="meta"></p><h3>受付内容</h3><div class="detail-grid" id="fields"></div><div class="field"><label for="status">受付ステータス</label><select id="status"><option>未対応</option><option>受付済</option><option>対応中</option><option>確認待ち</option><option>完了</option></select></div><div class="field"><label for="assignee">担当者</label><input id="assignee" placeholder="担当者名"></div><div class="field"><label for="memo">対応メモ</label><textarea id="memo" placeholder="対応内容を記入"></textarea></div><button class="primary" id="save" style="width:100%">受付情報を保存</button></div></section>
<p class="note">※ 営業用の架空データです。実在するお客様・GAS・スプレッドシート・LINE・Google Driveには接続していません。変更内容はこの画面内だけで反映され、ページを再読み込みすると初期状態に戻ります。</p></main>
<script>
'use strict';
const sample=[
{id:'DEMO-001',name:'山田 花子',type:'車両依頼',date:'2026/10/24 09:15',status:'未対応',assignee:'',memo:'',fields:[['納車希望','11月上旬'],['稼働開始希望','11月10日'],['稼働エリア','千葉県内'],['所属会社','サンプル運送'],['電話番号','090-0000-0001'],['提出書類','確認待ち']]},
{id:'DEMO-002',name:'佐藤 太郎',type:'レッカー依頼',date:'2026/10/24 08:40',status:'対応中',assignee:'担当A',memo:'状況を確認中',fields:[['発生場所','千葉市内（サンプル）'],['車両番号','習志野 300 あ 12-34'],['トラブルの状況','エンジンがかからない'],['連絡先','090-0000-0002']]},
{id:'DEMO-003',name:'鈴木 美咲',type:'返却依頼',date:'2026/10/23 17:30',status:'受付済',assignee:'担当B',memo:'',fields:[['返却希望日','10月28日'],['返却希望時間','14:00'],['車両番号','千葉 500 い 56-78'],['返却写真','受領済み（デモ表示）']]},
{id:'DEMO-004',name:'高橋 健',type:'事故報告',date:'2026/10/23 11:05',status:'確認待ち',assignee:'担当A',memo:'写真の確認待ち',fields:[['事故発生場所','船橋市内（サンプル）'],['事故状況','駐車中の接触'],['おケガの有無','なし'],['提出写真','受領済み（デモ表示）']]},
{id:'DEMO-005',name:'田中 愛',type:'任意保険加入申込',date:'2026/10/22 15:20',status:'完了',assignee:'担当C',memo:'手続き完了',fields:[['加入希望','任意保険'],['申込内容','必要書類を受付済み'],['契約状況','完了（デモ表示）']]}
];
let records=structuredClone(sample),current=-1;
const $=id=>document.getElementById(id);
function draw(){const n=s=>records.filter(r=>s.includes(r.status)).length;$('counts').innerHTML=[['未対応',n(['未対応'])],['対応中',n(['受付済','対応中','確認待ち'])],['完了',n(['完了'])]].map(([s,v])=>`<div><strong>${v}</strong><span class="muted">${s}</span></div>`).join('');$('list').replaceChildren();records.forEach((r,i)=>{const b=document.createElement('button');b.className='record';const top=document.createElement('div');top.className='top';const name=document.createElement('b');name.textContent=r.name;const status=document.createElement('span');status.className='pill';status.textContent=r.status;top.append(name,status);const p=document.createElement('p');p.textContent=r.type;const time=document.createElement('div');time.className='muted';time.textContent=r.date+'　› 詳細を見る';b.append(top,p,time);b.onclick=()=>openDetail(i);$('list').append(b)})}
function openDetail(i){current=i;const r=records[i];$('name').textContent=r.name;$('badge').textContent=r.status;$('meta').textContent=r.type+' / '+r.date;$('fields').replaceChildren();r.fields.forEach(([k,v],idx)=>{const d=document.createElement('div');d.className='cell'+(idx<2?' key':'')+(v.length>35?' wide':'');const small=document.createElement('small');small.textContent=k;const strong=document.createElement('strong');strong.textContent=v;d.append(small,strong);$('fields').append(d)});$('status').value=r.status;$('assignee').value=r.assignee;$('memo').value=r.memo;$('home').style.display='none';$('detail').style.display='block';window.scrollTo(0,0)}
function back(){$('home').style.display='block';$('detail').style.display='none';current=-1;draw();window.scrollTo(0,0)}
$('back').onclick=back;$('save').onclick=()=>{if(current<0)return;const r=records[current];r.status=$('status').value;r.assignee=$('assignee').value.trim();r.memo=$('memo').value.trim();alert('デモ画面内で保存しました（本番データには反映されません）');back()};$('reset').onclick=()=>{if(confirm('デモの変更内容を初期化しますか？')){records=structuredClone(sample);draw()}};draw();
</script></body></html>
