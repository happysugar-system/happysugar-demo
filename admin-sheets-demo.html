<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy sugar｜管理スプレッドシート DEMO</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#24354a;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}header{background:#233a58;color:white;padding:18px 24px}header h1{font-size:23px;margin:0}header small{color:#d7e3f1}main{max-width:1250px;margin:auto;padding:20px}section{background:white;border:1px solid #dce5e4;border-radius:13px;padding:18px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd8dd}button{cursor:pointer;background:#233a58;color:white;border-color:#233a58;font-weight:700}button.secondary{background:white;color:#233a58}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls input{flex:1;min-width:160px}.muted{color:#687584;font-size:13px}.hidden{display:none}.message{padding:9px 12px;border-radius:8px;background:#edf5fb;margin:12px 0;white-space:pre-wrap}.scroll{overflow:auto;border:1px solid #d9e2e5;border-radius:8px}table{border-collapse:collapse;min-width:780px;width:100%;font-size:14px}th,td{border:1px solid #dce5e4;padding:9px 10px;text-align:left}th{background:#e7f1e8;position:sticky;top:0}tr:nth-child(even){background:#fafcfb}td input,td select{width:100%;min-width:100px;padding:7px;background:white}td:nth-child(1){width:65px}.add{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;margin-top:12px}.add input{width:100%;min-width:0}.tag{display:inline-block;background:#fcebf2;color:#884963;padding:4px 10px;border-radius:20px;font-size:12px}.tabs{display:flex;gap:8px;margin:0 0 16px}.tabs button{background:#e8edf1;color:#4c5b69;border-color:#e8edf1}.tabs button.active{background:#233a58;color:white}.warning{color:#8a5c19}@media(max-width:680px){main{padding:12px}header{padding:16px}.add{grid-template-columns:1fr}.controls{align-items:stretch}.controls button{flex:1}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><header><small>Happy sugar / 営業用デモ</small><h1>📊 管理スプレッドシート <span class="tag">DEMO</span></h1></header><main><section><h2>🔐 管理者ログイン</h2><div id="login" class="controls"><input id="email" type="email" placeholder="登録済みメールアドレス" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="loginBtn">ログイン</button></div><div id="signed" class="controls hidden"><span id="signedEmail" class="muted"></span><button id="logoutBtn" class="secondary">ログアウト</button></div><div id="message" class="message">ログインするとSupabaseの営業デモ用データを表示します。</div></section><section id="workspace" class="hidden"><div class="tabs"><button class="active" type="button">🚗 車両台帳</button><button class="secondary" type="button" disabled title="次の段階で接続">📩 LINE受付（準備中）</button><button class="secondary" type="button" disabled title="次の段階で接続">📅 勤怠・シフト（準備中）</button></div><div class="controls"><input id="search" placeholder="車番・使用者・ステータスで検索"><button id="reload">↻ 最新情報を読み込む</button><span id="count" class="muted"></span></div><p class="muted">セルを変更したら、その行の「保存」を押してください。スマホ側は「最新の車両を読み込む」で反映できます。</p><div class="scroll"><table><thead><tr><th>ID</th><th>車両番号</th><th>現在使用者</th><th>ステータス</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><h2 style="margin-top:22px">➕ 車両を追加</h2><div class="add"><input id="newVehicle" placeholder="例：千葉 99-99"><input id="newDriver" placeholder="使用者（任意）"><select id="newStatus"><option>空車</option><option>貸出中</option><option>代車中</option></select><button id="addBtn">登録</button></div></section><p class="muted">※ 営業デモ専用の架空データを扱います。Googleスプレッドシート本体やGOLD FIRSTの本番システムには接続していません。ログインできるユーザーはデモ用データを編集できます。</p></main><script>
'use strict';
const URL='https://nsollcxoekrwkgsyvokd.supabase.co';
const KEY='sb_publishable_B_j9NDGXiETJBw9dZq35uw_UmuuqsJw';
const db=window.supabase?.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let session=null,records=[];
function msg(s){$('message').textContent=s}
function authUI(){const yes=!!session;$('login').classList.toggle('hidden',yes);$('signed').classList.toggle('hidden',!yes);$('workspace').classList.toggle('hidden',!yes);$('signedEmail').textContent=session?.user?.email||''}
async function login(){if(!db)return msg('通信ライブラリを読み込めませんでした。');const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('メールとパスワードを入力してください。');msg('ログイン中…');const {data,error}=await db.auth.signInWithPassword({email,password});$('password').value='';if(error)return msg('ログイン失敗：'+error.message);session=data.session;authUI();await load()}
async function logout(){await db?.auth.signOut();session=null;records=[];authUI();msg('ログアウトしました。')}
async function load(){if(!session)return;msg('最新データを読み込み中…');const {data,error}=await db.from('demo_vehicles').select('id,vehicle_number,driver_name,status').order('id',{ascending:true});if(error)return msg('読み込み失敗：'+error.message);records=data||[];render();msg('✓ 最新の車両台帳を読み込みました。')}
function input(value){const el=document.createElement('input');el.value=value??'';return el}
function render(){const q=$('search').value.trim().toLowerCase(),list=records.filter(r=>[r.vehicle_number,r.driver_name,r.status].some(x=>String(x||'').toLowerCase().includes(q)));$('count').textContent=`${list.length}件表示 / 全${records.length}件`;$('rows').replaceChildren();for(const r of list){const tr=document.createElement('tr');const id=document.createElement('td');id.textContent=r.id;const plate=document.createElement('td'),name=document.createElement('td'),status=document.createElement('td'),action=document.createElement('td');const p=input(r.vehicle_number),n=input(r.driver_name),s=document.createElement('select');for(const v of ['空車','貸出中','代車中']){const o=document.createElement('option');o.textContent=v;s.append(o)}if(!['空車','貸出中','代車中'].includes(r.status||'')){const o=document.createElement('option');o.textContent=r.status||'未設定';s.append(o)}s.value=r.status||'未設定';plate.append(p);name.append(n);status.append(s);const b=document.createElement('button');b.textContent='保存';b.onclick=async()=>{const vehicle_number=p.value.trim();if(!vehicle_number)return msg('車両番号は必須です。');b.disabled=true;msg('保存中…');const {error}=await db.from('demo_vehicles').update({vehicle_number,driver_name:n.value.trim(),status:s.value}).eq('id',r.id);b.disabled=false;if(error)return msg('保存失敗：'+error.message);await load();msg(`✓ ID ${r.id} を保存しました。`)};action.append(b);tr.append(id,plate,name,status,action);$('rows').append(tr)}}
async function add(){const vehicle_number=$('newVehicle').value.trim();if(!vehicle_number)return msg('車両番号を入力してください。');if(records.some(r=>r.vehicle_number===vehicle_number))return msg('同じ車両番号が登録されています。');$('addBtn').disabled=true;msg('登録中…');const {error}=await db.from('demo_vehicles').insert({vehicle_number,driver_name:$('newDriver').value.trim(),status:$('newStatus').value});$('addBtn').disabled=false;if(error)return msg('登録失敗：'+error.message);$('newVehicle').value='';$('newDriver').value='';await load();msg('✓ 車両を登録しました。')}
$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('reload').onclick=load;$('search').oninput=render;$('addBtn').onclick=add;
(async()=>{if(!db)return msg('通信ライブラリを読み込めませんでした。');const {data}=await db.auth.getSession();session=data.session;authUI();if(session)await load()})();
</script></body></html>
