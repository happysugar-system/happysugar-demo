<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勝馬分析AI｜パパ用デモ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202632;font-family:system-ui,-apple-system,sans-serif}header{background:#152a40;color:white;padding:18px 16px}h1{font-size:21px;margin:0}small{color:#667485}header small{color:#c9d6e2}.wrap{max-width:700px;margin:auto;padding:14px}.tabs{display:flex;background:white;border-radius:12px;padding:5px;gap:5px}.tabs button{flex:1;border:0;border-radius:9px;padding:13px 5px;background:transparent;font-weight:700;color:#536173}.tabs button.active{background:#1b5d79;color:white}.card{background:white;border-radius:15px;padding:16px;margin-top:12px;box-shadow:0 2px 8px #0000000a}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{font-size:29px;font-weight:800;color:#c53942}.sub{font-size:13px;color:#6c7582}.pill{display:inline-block;background:#e8f2f4;border-radius:99px;padding:4px 10px;font-size:12px}.btn{background:#1b5d79;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.ghost{background:#eef1f4;color:#273b4a}input[type=number]{width:78px;padding:9px;border:1px solid #d4dbe0;border-radius:8px;font-size:17px}input[type=file]{width:100%;padding:10px 0}.rule{padding:10px 0;border-bottom:1px solid #eef0f2}.rule:last-child{border:0}.muted{color:#777}.mark{font-size:25px;color:#c33;font-weight:900}.hidden{display:none}#paper{position:relative;overflow:auto;border:1px solid #ddd;min-height:260px;background:#f9fafb}#paper img{display:block;width:100%;height:auto}#paper .stamp{position:absolute;color:#c32b39;font-weight:900;font-size:27px;touch-action:none;cursor:grab;text-shadow:0 1px 2px white;user-select:none}footer{font-size:12px;color:#647180;padding:18px;text-align:center}</style></head><body>
<header><h1>🏇 勝馬分析AI</h1><small>パパ専用・スマホ操作デモ｜東京11R 芝1800m</small></header><div class="wrap">
<div class="tabs"><button id="t1" class="active" onclick="tab('rank')">採点ランキング</button><button id="t2" onclick="tab('paper')">新聞書き込み</button></div>
<section id="rank"><p class="sub">確認済みの2頭のみ。全頭ランキングではありません。点数をタップして編集できます。</p><div id="horses"></div></section>
<section id="paperSection" class="hidden"><div class="card"><b>新聞の写真を読み込む</b><p class="sub">画像は端末内で表示するだけ。サーバーには送信しません。</p><input type="file" id="photo" accept="image/*"><div class="line" style="flex-wrap:wrap"><select id="symbol" style="padding:10px;font-size:16px"><option>○</option><option>△</option><option>×</option><option>／</option><option>7.0</option><option>2.5</option></select><button class="btn" onclick="addStamp()">記号を追加</button><button class="btn ghost" onclick="clearStamps()">記号を消す</button></div><p class="sub">追加した記号はドラッグで移動できます。ダブルタップで削除。</p><div id="paper"><div style="padding:50px 15px;text-align:center;color:#87919c" id="placeholder">ここに新聞画像が表示されます</div></div></div></section>
<footer>操作確認用デモ。新聞の自動読み取り・自動採点・自動配置は未実装です。</footer></div>
<script>
const initial=[{id:'lav',name:'⑪ ラヴァンダ',base:3.5,train:3.5,details:[['過去走・重賞など',3.5],['調教の評価',3.5]]},{id:'nishi',name:'① ニシノティアモ',base:1,train:1.5,details:[['過去走・重賞など',2.5],['関東厩舎',-1],['休養',-.5],['調教の評価',1.5]]}];
let horses=JSON.parse(JSON.stringify(initial));function tab(v){document.getElementById('rank').classList.toggle('hidden',v!=='rank');document.getElementById('paperSection').classList.toggle('hidden',v!=='paper');document.getElementById('t1').classList.toggle('active',v==='rank');document.getElementById('t2').classList.toggle('active',v==='paper')}
function render(){let box=document.getElementById('horses');box.innerHTML='';horses.slice().sort((a,b)=>sum(b)-sum(a)).forEach((h,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="line"><div><span class="pill">'+(i+1)+'位</span> <b>'+h.name+'</b></div><span class="score">'+sum(h).toFixed(1)+'点</span></div><p class="sub">基礎 '+base(h).toFixed(1)+' ＋ 調教 '+training(h).toFixed(1)+'</p><details><summary style="cursor:pointer;padding:8px 0;color:#1b5d79;font-weight:700">採点内訳を確認・修正</summary><div class="rules"></div></details>';let rules=d.querySelector('.rules');h.details.forEach((r,j)=>{let row=document.createElement('div');row.className='rule line';let label=document.createElement('span');label.textContent=r[0];let input=document.createElement('input');input.type='number';input.step='.5';input.value=r[1];input.setAttribute('aria-label',r[0]);input.onchange=()=>{if(!Number.isFinite(Number(input.value)))return;h.details[j][1]=Number(input.value);render()};row.append(label,input);rules.append(row)});box.append(d)})}
function sum(h){return h.details.reduce((a,r)=>a+r[1],0)}function training(h){return h.details.find(x=>x[0]==='調教の評価')[1]}function base(h){return sum(h)-training(h)}render();
let imgUrl=null;document.getElementById('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(imgUrl)URL.revokeObjectURL(imgUrl);imgUrl=URL.createObjectURL(f);let paper=document.getElementById('paper');paper.innerHTML='';let img=document.createElement('img');img.src=imgUrl;img.alt='読み込んだ新聞';paper.append(img)});
function addStamp(){let p=document.getElementById('paper'),s=document.createElement('span');s.className='stamp';s.textContent=document.getElementById('symbol').value;s.style.left='35%';s.style.top='35%';p.append(s);let start=null;s.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,l:s.offsetLeft,t:s.offsetTop};s.setPointerCapture(e.pointerId)});s.addEventListener('pointermove',e=>{if(!start)return;s.style.left=Math.max(0,Math.min(p.clientWidth-s.offsetWidth,start.l+e.clientX-start.x))+'px';s.style.top=Math.max(0,Math.min(p.clientHeight-s.offsetHeight,start.t+e.clientY-start.y))+'px'});s.addEventListener('pointerup',()=>start=null);s.addEventListener('dblclick',()=>s.remove())}
function clearStamps(){document.querySelectorAll('.stamp').forEach(e=>e.remove())}
</script></body></html>
