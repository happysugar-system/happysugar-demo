<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{font:16px system-ui;margin:18px;background:#f4f6f8;color:#173047}main{max-width:650px;margin:auto;background:white;padding:16px;border-radius:14px}button{background:#175d79;color:white;padding:12px;border:0;border-radius:8px;font-size:16px}img{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:15px 0}</style></head><body><main><h2>🏇 勝馬AI｜1頭読み取りテスト</h2><p>新聞の1頭分を切り抜いた画像を選択してください。初回は最大4回/月。採点はまだ行いません。</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p><img id="preview"></p><label><input type="checkbox" id="consent"> 選択した画像をOpenAI APIへ送信することに同意します</label><button id="run" disabled>AIで読み取る（課金あり）</button><pre id="out"></pre></main><script>let data=null;const $=x=>document.getElementById(x);function ready(){$("run").disabled=!data||!$("consent").checked} $("consent").onchange=ready;$("file").onchange=()=>{data=null;ready();const f=$("file").files[0];if(!f)return;if(f.size>2800000){$("out").textContent="画像を2.8MB以下にしてください";return}const r=new FileReader();r.onload=()=>{data=r.result;$("preview").src=data;ready()};r.readAsDataURL(f)};$("run").onclick=()=>{$("run").disabled=true;$("out").textContent="読み取り中…";google.script.run.withSuccessHandler(r=>{$("out").textContent=JSON.stringify(r,null,2);ready()}).withFailureHandler(e=>{$("out").textContent=e.message;ready()}).readHorseImage(data,$("consent").checked)};</script></body></html>
