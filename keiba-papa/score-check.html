<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パパ式採点エンジン｜検証</title><style>body{font-family:system-ui,sans-serif;background:#f3f6f9;color:#203040;margin:0}header{background:#173047;color:white;padding:16px}main{max-width:700px;margin:auto;padding:12px}.card{background:white;border-radius:13px;padding:16px;margin:12px 0}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:8px 0}.score{font-size:30px;color:#c43a47;font-weight:800}.muted{font-size:12px;color:#64748b}.ok{color:#087c58}.warning{color:#a25a00}button{padding:10px;border:0;border-radius:8px;background:#175d79;color:white;font-weight:700}select{padding:10px;font-size:16px}</style><header><h2 style="margin:0">🏇 パパ式採点エンジン</h2><small>採点の根拠を1項目ずつ検証</small></header><main><div class="card"><label>検証する馬　<select id="horse"><option value="n">ニシノティアモ</option><option value="l">ラヴァンダ</option></select></label><p class="muted">過去4走のうち、会話で確認できた走のみ登録。未確認の走は空欄のまま扱います。</p><div id="result"></div></div><div class="card"><b>採点の考え方</b><p class="muted">AIによる推測ではなく、確認済みのルールで計算。調教のコメントや休養などは、パパが確認した値を使用しています。</p><p><a href="./analysis.html">新聞PDFの表示画面に戻る</a></p></div></main><script src="./papa-score.js"></script><script>
const samples={
n:{name:"ニシノティアモ",targetDistance:1800,races:[{distance:1800,finish:1,grade:3},null,null,null],kanto:true,age:5,restDeduction:-.5,trainingMarks:[{label:"調教：上向き矢印",points:1,symbol:"○"},{label:"調教：余裕十分に伸びた",points:.5,symbol:"△"}],expected:2.5},
l:{name:"ラヴァンダ",targetDistance:1800,races:[{distance:1600,finish:2,grade:3},{distance:1600,finish:1,grade:3},null,null],kanto:false,age:5,restDeduction:0,jockeyChanged:true,jockeyWinRateAtTrack:.15,trainingMarks:[{label:"調教：上向き矢印",points:1,symbol:"○"},{label:"調教：単評○",points:1,symbol:"○"},{label:"調教：単評△①",points:.5,symbol:"△"},{label:"調教：単評△②",points:.5,symbol:"△"},{label:"調教：単評△③",points:.5,symbol:"△"}],expected:7}
};function show(){let s=samples[document.getElementById("horse").value],r=PapaScore.score(s),root=document.getElementById("result");root.replaceChildren();let top=document.createElement("div");top.innerHTML='<p class="score">'+r.total.toFixed(1)+'点</p><p>基礎 '+r.base.toFixed(1)+' ＋ 調教 '+r.training.toFixed(1)+'</p><p class="ok">パパの正解 '+s.expected.toFixed(1)+'点 ／ '+(r.total===s.expected?'一致 ✓':'不一致')+'</p>';root.append(top);r.items.forEach(x=>{let row=document.createElement("div");row.className="line";let a=document.createElement("span");a.textContent=x.group+"｜"+x.label;let b=document.createElement("strong");b.textContent=x.symbol+" "+(x.points>0?"+":"")+x.points.toFixed(1);row.append(a,b);root.append(row)});r.warnings.forEach(w=>{let p=document.createElement("p");p.className="muted warning";p.textContent="要確認："+w;root.append(p)})}document.getElementById("horse").addEventListener("change",show);show();
</script></html>
